name: Python package

on: [pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          pip install --editable .
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      - name: Test with pytest
        run: |
          pytest

  test_sdist:
    name: Test source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist
      - name: Test sdist in isolation
        run: |
          test_root="${RUNNER_TEMP}/upolygon-sdist-test"
          python -m venv "${test_root}/venv"
          "${test_root}/venv/bin/python" -m pip install --upgrade pip
          "${test_root}/venv/bin/python" -m pip install --no-cache-dir \
            "${GITHUB_WORKSPACE}"/dist/*.tar.gz pytest
          cp -R "${GITHUB_WORKSPACE}/tests" "${test_root}/tests"
          cd "${test_root}"
          "${test_root}/venv/bin/python" -m pytest tests
